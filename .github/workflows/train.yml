name: Retrain Model
on:
  workflow_dispatch:   # manual only — never run on cron
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/train_model.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit updated model files
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add model/xgb_p10.json model/xgb_p50.json model/xgb_p90.json model/features.json
          git diff --staged --quiet || git commit -m "Retrained model [skip ci]"
          git push
